databaseChangeLog:
  - changeSet:
      id: 013-create-announcement
      author: cultivated-consultation
      changes:
        - createTable:
            schemaName: cultivated_consultation
            tableName: announcement
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_by_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_announcement_created_by
                    references: cultivated_consultation.app_user(id)
              - column:
                  name: message
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
