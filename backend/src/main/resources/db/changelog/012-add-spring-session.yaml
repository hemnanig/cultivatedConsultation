databaseChangeLog:
  - changeSet:
      id: 017-create-spring-session
      author: cultivated-consultation
      comment: >
        Login sessions in Postgres instead of JVM memory — an in-memory HttpSession
        is wiped on every backend restart (Render redeploy, cold-start after idle,
        crash), which was silently signing every member out constantly. Schema
        matches spring-session-jdbc's own schema-postgresql.sql exactly (see
        org/springframework/session/jdbc/schema-postgresql.sql in the
        spring-session-jdbc jar) so JdbcIndexedSessionRepository's built-in queries
        work unmodified — table-name is set to
        cultivated_consultation.spring_session in application.yml, which
        JdbcIndexedSessionRepository derives the attributes table name from by
        appending _ATTRIBUTES, hence spring_session_attributes below.
      changes:
        - sql:
            sql: >
              CREATE TABLE cultivated_consultation.spring_session (
                primary_id CHAR(36) NOT NULL,
                session_id CHAR(36) NOT NULL,
                creation_time BIGINT NOT NULL,
                last_access_time BIGINT NOT NULL,
                max_inactive_interval INT NOT NULL,
                expiry_time BIGINT NOT NULL,
                principal_name VARCHAR(100),
                CONSTRAINT spring_session_pk PRIMARY KEY (primary_id)
              );

              CREATE UNIQUE INDEX spring_session_ix1 ON cultivated_consultation.spring_session (session_id);
              CREATE INDEX spring_session_ix2 ON cultivated_consultation.spring_session (expiry_time);
              CREATE INDEX spring_session_ix3 ON cultivated_consultation.spring_session (principal_name);

              CREATE TABLE cultivated_consultation.spring_session_attributes (
                session_primary_id CHAR(36) NOT NULL,
                attribute_name VARCHAR(200) NOT NULL,
                attribute_bytes BYTEA NOT NULL,
                CONSTRAINT spring_session_attributes_pk PRIMARY KEY (session_primary_id, attribute_name),
                CONSTRAINT spring_session_attributes_fk FOREIGN KEY (session_primary_id)
                  REFERENCES cultivated_consultation.spring_session(primary_id) ON DELETE CASCADE
              );
