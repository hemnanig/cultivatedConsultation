databaseChangeLog:
  - changeSet:
      id: 010-create-message
      author: cultivated-consultation
      changes:
        - createTable:
            schemaName: cultivated_consultation
            tableName: message
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_message_sender
                    references: cultivated_consultation.app_user(id)
              - column:
                  name: recipient_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_message_recipient
                    references: cultivated_consultation.app_user(id)
              - column:
                  name: content
                  type: VARCHAR(4000)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            schemaName: cultivated_consultation
            indexName: idx_message_recipient_read
            tableName: message
            columns:
              - column:
                  name: recipient_id
              - column:
                  name: read_at
