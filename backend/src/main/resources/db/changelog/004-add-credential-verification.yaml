databaseChangeLog:
  - changeSet:
      id: 009-add-credential-verification-to-app-user
      author: cultivated-consultation
      changes:
        - addColumn:
            schemaName: cultivated_consultation
            tableName: app_user
            columns:
              - column:
                  name: license_number
                  type: VARCHAR(100)
              - column:
                  name: license_state
                  type: VARCHAR(50)
              - column:
                  name: credential_status
                  type: VARCHAR(32)
                  defaultValue: UNVERIFIED
                  constraints:
                    nullable: false
