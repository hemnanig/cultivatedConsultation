databaseChangeLog:
  - changeSet:
      id: 006-create-consultation-group
      author: cultivated-consultation
      changes:
        - createTable:
            schemaName: cultivated_consultation
            tableName: consultation_group
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_group_created_by
                    references: cultivated_consultation.app_user(id)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-create-group-membership
      author: cultivated-consultation
      changes:
        - createTable:
            schemaName: cultivated_consultation
            tableName: group_membership
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_membership_group
                    references: cultivated_consultation.consultation_group(id)
              - column:
                  name: member_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_membership_member
                    references: cultivated_consultation.app_user(id)
              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            schemaName: cultivated_consultation
            tableName: group_membership
            columnNames: group_id, member_id
            constraintName: uq_group_membership

  - changeSet:
      id: 008-add-group-id-to-post
      author: cultivated-consultation
      changes:
        - addColumn:
            schemaName: cultivated_consultation
            tableName: post
            columns:
              - column:
                  name: group_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableSchemaName: cultivated_consultation
            baseTableName: post
            baseColumnNames: group_id
            referencedTableSchemaName: cultivated_consultation
            referencedTableName: consultation_group
            referencedColumnNames: id
            constraintName: fk_post_group
